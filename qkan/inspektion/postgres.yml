inspektion_ref_knotenart_m150: |-
  WITH referenz(m150_code, schachttyp, knotentyp, sortierung) AS (
      VALUES
          ('A', 'Auslass', 'Auslass', 1),
          ('B', 'Speicher', 'Bauwerk', 2),
          ('E', 'Symbol', 'Straßenablauf', 3),
          ('F', 'Schacht', 'Fiktiver Schacht', 4),
          ('G', 'Schacht', 'Gebäudeanschluss', 5),
          ('I', 'Symbol', 'Inspektionsöffnung', 6),
          ('L', 'Symbol', 'Lampenschacht', 7),
          ('R', 'Symbol', 'Reinigungsöffnung', 8),
          ('S', 'Schacht', 'Schacht', 9),
          ('W', 'Symbol', 'Sanitärgegenstand', 10),
          ('Z', 'Symbol', 'Sonstige', 11)
  ),
  alias(vergleichswert, m150_code, sortierung) AS (
      VALUES
          ('auslass', 'A', 1),
          ('bauwerk', 'B', 2),
          ('speicher', 'B', 3),
          ('straßenablauf', 'E', 4),
          ('strassenablauf', 'E', 5),
          ('fiktiver schacht', 'F', 6),
          ('gebäudeanschluss', 'G', 7),
          ('gebaeudeanschluss', 'G', 8),
          ('inspektionsöffnung', 'I', 9),
          ('inspektionsoeffnung', 'I', 10),
          ('lampenschacht', 'L', 11),
          ('reinigungsöffnung', 'R', 12),
          ('reinigungsoeffnung', 'R', 13),
          ('schacht', 'S', 14),
          ('sanitärgegenstand', 'W', 15),
          ('sanitaergegenstand', 'W', 16),
          ('symbol', 'Z', 17),
          ('sonstige', 'Z', 18),
          ('sonstiges', 'Z', 19)
  )
  SELECT m150_code, schachttyp, knotentyp, vergleichswert
  FROM (
      SELECT
          m150_code,
          schachttyp,
          knotentyp,
          NULL AS vergleichswert,
          sortierung
      FROM referenz

      UNION ALL

      SELECT
          m150_code,
          NULL AS schachttyp,
          NULL AS knotentyp,
          vergleichswert,
          1000 + sortierung AS sortierung
      FROM alias
  ) AS knotenart_zuordnung
  ORDER BY sortierung;

inspektion_export_haltungen_auswahl: SELECT pk, haltnam, schoben, schunten, hoehe, breite, laenge, sohleoben, sohleunten,
  baujahr, profilnam, entwart, abflussart, material, profilauskleidung, innenmaterial, ST_AsBinary(geom) AS __geom_wkb FROM {schema}.haltungen WHERE
  haltnam IN ({auswahl}) AND (haltungstyp IS NULL OR haltungstyp = 'Haltung') ORDER BY pk;
inspektion_export_schaechte_auswahl: SELECT pk, schnam, sohlhoehe, durchm, entwart, knotentyp, schachttyp, druckdicht, xsch, ysch, ST_AsBinary(geop)
  AS __geom_wkb FROM {schema}.schaechte WHERE schnam IN ({auswahl}) AND schachttyp = 'Schacht' ORDER BY pk;
inspektion_export_anschlussleitungen_auswahl: SELECT pk, leitnam, schoben, schunten, hoehe, breite, laenge, sohleoben, sohleunten,
  baujahr, haltnam, urstation, ursprung, anschlusstyp, lageanschluss, profilnam, entwart, material, profilauskleidung, innenmaterial,
  ST_AsBinary(geom) AS __geom_wkb FROM {schema}.anschlussleitungen WHERE leitnam IN ({auswahl}) ORDER BY pk;
inspektion_export_anschlussschaechte_haltungen: SELECT pk, schnam, sohlhoehe, durchm, entwart, strasse, baujahr, haltnam, urstation,
  knotentyp, simstatus, material, xsch, ysch, kommentar, ST_AsBinary(geom) AS __geom_wkb FROM {schema}.anschlussschaechte
  ORDER BY pk;

inspektion_import_index_schaechte: SELECT pk, schnam FROM {schema}.schaechte WHERE schnam IS NOT NULL AND schachttyp = 'Schacht' ORDER
  BY pk;
inspektion_import_index_haltungen: SELECT pk, haltnam FROM {schema}.haltungen WHERE haltnam IS NOT NULL AND (haltungstyp IS NULL OR
  haltungstyp = 'Haltung') ORDER BY pk;
inspektion_import_index_anschlussleitungen: SELECT pk, leitnam FROM {schema}.anschlussleitungen WHERE leitnam IS NOT NULL ORDER BY
  pk;
inspektion_import_index_schaechte_untersucht: SELECT pk, schnam, untersuchtag, id FROM {schema}.schaechte_untersucht ORDER BY pk;
inspektion_import_index_untersuchdat_schacht: SELECT pk, untersuchsch, untersuchtag, id FROM {schema}.untersuchdat_schacht ORDER BY
  pk;
inspektion_import_index_haltungen_untersucht: SELECT pk, haltnam, untersuchtag, id FROM {schema}.haltungen_untersucht ORDER BY pk;
inspektion_import_index_untersuchdat_haltung: SELECT pk, untersuchhal, untersuchtag, id FROM {schema}.untersuchdat_haltung ORDER BY
  pk;
inspektion_import_index_anschlussleitungen_untersucht: SELECT pk, leitnam, untersuchtag, id FROM {schema}.anschlussleitungen_untersucht
  ORDER BY pk;
inspektion_import_index_untersuchdat_anschlussleitung: SELECT pk, untersuchleit, untersuchtag, id FROM {schema}.untersuchdat_anschlussleitung
  ORDER BY pk;
