# PostgreSQL-Abfragen für M150-Import und -Export des Inspektionsmoduls.
# Das Schema wird erst nach der sicheren Layerauswahl als SQL-Bezeichner
# eingesetzt. Die fachlichen Zuordnungen entsprechen sqlite.yml.

inspektion_ref_entwaesserungsarten_m150: |-
  WITH entwart_werte(wert) AS (
      SELECT bezeichnung
      FROM {schema}.entwaesserungsarten
      WHERE bezeichnung IS NOT NULL

      UNION

      SELECT kuerzel
      FROM {schema}.entwaesserungsarten
      WHERE kuerzel IS NOT NULL

      UNION SELECT 'M'
      UNION SELECT 'R'
      UNION SELECT 'S'
      UNION SELECT 'Mischwasser'
      UNION SELECT 'Regenwasser'
      UNION SELECT 'Schmutzwasser'
      UNION SELECT 'KM-Kanal'
      UNION SELECT 'KR-Kanal'
      UNION SELECT 'KS-Kanal'
  ),
  normalisiert AS (
      SELECT DISTINCT
          UPPER(
              REPLACE(
                  REPLACE(
                      REPLACE(TRIM(wert), ' ', ''),
                      '-',
                      ''
                  ),
                  '_',
                  ''
              )
          ) AS vergleichswert
      FROM entwart_werte
      WHERE TRIM(wert) <> ''
  ),
  zugeordnet AS (
      SELECT
          vergleichswert,
          CASE
              WHEN vergleichswert = 'M'
                OR vergleichswert LIKE 'MW%'
                OR vergleichswert LIKE 'KM%'
                OR vergleichswert LIKE '%MISCH%'
                  THEN 'M'
              WHEN vergleichswert = 'R'
                OR vergleichswert LIKE 'RW%'
                OR vergleichswert LIKE 'KR%'
                OR vergleichswert LIKE '%REGEN%'
                  THEN 'R'
              WHEN vergleichswert = 'S'
                OR vergleichswert LIKE 'SW%'
                OR vergleichswert LIKE 'KS%'
                OR vergleichswert LIKE '%SCHMUTZ%'
                  THEN 'S'
              ELSE NULL
          END AS m150_code
      FROM normalisiert
  )
  SELECT
      vergleichswert,
      m150_code,
      CASE m150_code
          WHEN 'M' THEN 'Mischwasser'
          WHEN 'R' THEN 'Regenwasser'
          WHEN 'S' THEN 'Schmutzwasser'
      END AS langtext
  FROM zugeordnet
  WHERE m150_code IS NOT NULL
  ORDER BY vergleichswert;

