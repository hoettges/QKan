# View sonderbauwerke_view: In PostgreSQL nur anlegen, wenn er fehlt
# (kein DROP, da der View ggf. von einem Admin angelegt wurde)
nz_sbw_view_loeschen: ~

# Ein Teil der UNION je Tabelle; {kuerzel} = z.B. pw, {tabelle_name} ohne "..."
nz_sbw_view_teil: "
SELECT
    '{tabelle_name}'::text AS quelle,
    ('{kuerzel}_' || {kuerzel}_id::text) AS id,
    name,
    typ,
    system,
    strasse,
    ST_SetSRID(geop::geometry(Point), 25832) AS geop
FROM {tabelle}"

nz_sbw_view_erstellen: "
CREATE VIEW \"sonderbauwerke_view\" AS {union}"

# Registrierung als Geometrie-View: in PostGIS nicht erforderlich
nz_sbw_view_registrierung_loeschen: ~
nz_sbw_view_registrieren: ~

# ======================================================================
# Tabellenanzeige Sonderbauwerke (QSqlQueryModel)
# ======================================================================

nz_sbw_union_teil: "
SELECT name, '{tabelle_name}' AS typ, system, strasse, '{tabelle_name}' AS quelle
FROM {tabelle}"

nz_sbw_union_leer: "
SELECT 'Keine Daten' AS name, 'N/A' AS typ, 'N/A' AS system, 'N/A' AS strasse, 'N/A' AS quelle"

# ======================================================================
# Allgemeine Schreibzugriffe
# {zuweisungen}: "spalte" = %s, ...   {spalten}/{werte}: Spalten- bzw. Werteliste
# ======================================================================

nz_insert: "
INSERT INTO {tabelle} ({spalten}) VALUES ({werte})"

nz_update_objekt: "
UPDATE {tabelle} SET {zuweisungen} WHERE {schluessel} = %s"

# Geometrie aus WKB als Werte-Fragment fuer INSERT ({srid} = SRID der Zielspalte)
nz_geom_aus_wkb: "ST_GeomFromWKB(%s, {srid})"

# SRID einer Geometriespalte (Parameter: Tabelle, Spalte)
nz_geometrie_srid: "
SELECT srid FROM geometry_columns
WHERE lower(f_table_name) = lower(%s) AND lower(f_geometry_column) = lower(%s)
  AND f_table_schema = ANY(current_schemas(false))"

# Schachtumriss (geom, Kreis aus xsch/ysch/durchm) wie im QKan-Import
# Parameter: schnam
nz_schacht_umriss: "
UPDATE schaechte
SET geom = ST_Multi(ST_Boundary(ST_Buffer(
    ST_SetSRID(ST_MakePoint(xsch, ysch), {srid}), coalesce(durchm / 2, 0.5), 32)))
WHERE schnam = %s AND geom IS NULL AND xsch IS NOT NULL AND ysch IS NOT NULL"

# Geometrie aus WKT als Werte-Fragment fuer INSERT/UPDATE
nz_geom_aus_wkt: "ST_GeomFromText(%s, 25832)"

# Sperrpruefung: in PostgreSQL nicht erforderlich
nz_sperre_wartezeit_aus: ~
nz_sperre_beginn: ~
nz_sperre_ende: ~
nz_sperre_wartezeit_an: ~

# ======================================================================
# Sonderbauwerke bearbeiten
# Datensatz ueber die ID-Spalte der Tabelle ({id_spalte}, z.B. "pw_id")
# ======================================================================

nz_sbw_loeschen: "
DELETE FROM {tabelle} WHERE name = %s"

nz_sbw_id: "
SELECT {id_spalte} FROM {tabelle} WHERE name = %s LIMIT 1"

nz_sbw_datensatz: "
SELECT * FROM {tabelle} WHERE {id_spalte} = %s"

nz_sbw_update: "
UPDATE {tabelle} SET {zuweisungen} WHERE {id_spalte} = %s"

# Geometrie des zuletzt angelegten Sonderbauwerks setzen (Parameter: WKT)
nz_sbw_geometrie_setzen: "
UPDATE {tabelle} SET {geomspalte} = ST_GeomFromText(%s, 25832)
WHERE {id_spalte} = (SELECT MAX({id_spalte}) FROM {tabelle})"

# ======================================================================
# Export Untersuchungsdaten
# {tabelle}: untersuchdat_*   {spalte}: Objektspalte   {platzhalter}: IN-Liste
# ======================================================================

nz_export_historie: "
SELECT * FROM {tabelle} WHERE {spalte} IN ({platzhalter})"

nz_export_aktuell: "
SELECT t1.*
FROM {tabelle} t1
JOIN (
    SELECT {spalte}, MAX(untersuchtag) AS maxtag
    FROM {tabelle}
    WHERE {spalte} IN ({platzhalter})
    GROUP BY {spalte}
) t2 ON t1.{spalte} = t2.{spalte} AND t1.untersuchtag = t2.maxtag"

nz_export_einzeln: "
SELECT * FROM (
    SELECT *, ROW_NUMBER() OVER (PARTITION BY {spalte} ORDER BY untersuchtag DESC) AS rn
    FROM {tabelle}
    WHERE {spalte} IN ({platzhalter})
) t WHERE rn = 1"

# Rueckfall nur fuer alte SQLite-Versionen
nz_export_einzeln_alt: ~

nz_export_objektdaten: "
SELECT {schluessel}, {spalten} FROM {tabelle} WHERE {schluessel} IN ({platzhalter})"

# ======================================================================
# Excel-Import Sinkkaesten
# ======================================================================

nz_sk_existiert: "
SELECT 1 FROM {tabelle} WHERE {schluessel} = %s"

nz_sk_wert_lesen: "
SELECT {spalte} FROM {tabelle} WHERE {schluessel} = %s"

nz_sk_reinigung_verschieben: "
UPDATE {tabelle} SET {spalte_vor} = %s, {spalte_akt} = %s WHERE {schluessel} = %s"
