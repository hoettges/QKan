# SQL-Statements der Netzuebersicht fuer PostgreSQL/PostGIS
# Pendant: sqlite.yml (gleiche Schluessel, SQLite-Syntax)
# Stand: vorbereitet fuer die spaetere PostgreSQL-Unterstuetzung von QKan.
# Hinweise:
#   - Parameter '%s', variable Teile als {name} (Ersetzung per str.format)
#   - Tabellen-/Spaltennamen werden vom Code bereits in "..." gesetzt
#   - Tabellen werden ohne Schema angesprochen; massgeblich ist der Suchpfad
#     (nz_suchpfad, Schema aus der QKan-Datenquelle, danach public)
#   - null (~) = fuer diesen Datenbanktyp nicht benoetigt, wird uebersprungen
#   - Tabellendefinitionen uebernommen aus der bisherigen PostgreSQL-Anbindung
#     (db_postgres.py, RMKanDB)

# ======================================================================
# Verbindung / Metadaten
# ======================================================================

nz_verbindungstest: "
SELECT PostGIS_Version()"

# {schema}: Schema der QKan-Datenquelle (bereits in "...")
nz_suchpfad: "
SET search_path TO {schema}, public"

# Tabelle oder View vorhanden? (Parameter: Name)
nz_objekt_existiert: "
SELECT table_name FROM information_schema.tables
WHERE table_schema = ANY(current_schemas(false)) AND table_name = %s"

# Spalten einer Tabelle (Parameter: Name) -> (position, name, datentyp)
nz_spalten: "
SELECT ordinal_position, column_name, data_type
FROM information_schema.columns
WHERE table_schema = ANY(current_schemas(false)) AND table_name = %s
ORDER BY ordinal_position"

nz_anzahl: "
SELECT COUNT(*) FROM {tabelle}"

# ======================================================================
# Schema der Netzuebersicht (wird beim Start sichergestellt)
# ======================================================================

# Benoetigt Admin-Rechte; Fehler werden nur als Hinweis gemeldet
nz_postgis_extension: "
CREATE EXTENSION IF NOT EXISTS postgis"

nz_sinkkaesten_create: "
CREATE TABLE \"Sinkkästen\" (
    \"Name\" TEXT PRIMARY KEY,
    \"Schacht_oben\" TEXT,
    \"Schacht_unten\" TEXT,
    \"Entwässerungssystem\" TEXT,
    \"Baujahr\" INTEGER,
    \"Straßenname\" TEXT,
    \"Typ\" TEXT,
    \"Tiefe\" REAL,
    \"Schmutzfänger\" TEXT,
    \"Material\" TEXT,
    \"Bemerkung\" TEXT,
    \"aktuellste_Reinigung\" TEXT,
    \"vorherige_Reinigung\" TEXT,
    geom geometry(Point, 25832)
)"

# Uebernahme der Strasseneinlaeufe aus der Tabelle symbole
nz_sinkkaesten_import_symbole: "
INSERT INTO \"Sinkkästen\" (\"Name\", geom)
SELECT
    bezeichnung,
    geom
FROM symbole
WHERE art IN ('21 Straßeneinlauf', '22 Straßeneinlauf-SF', '23 Straßeneinlauf-SV')
AND bezeichnung NOT IN (SELECT \"Name\" FROM \"Sinkkästen\")"

nz_rinnen_create: "
CREATE TABLE \"entwaesserungsrinnen\" (
    \"Name\" TEXT PRIMARY KEY,
    \"Schacht_oben\" TEXT,
    \"Schacht_unten\" TEXT,
    \"Entwässerungssystem\" TEXT,
    \"Baujahr\" INTEGER,
    \"Straßenname\" TEXT,
    \"Typ\" TEXT,
    \"Material\" TEXT,
    \"Länge\" REAL,
    \"Bemerkung\" TEXT,
    geom_point geometry(Point, 25832),
    geom_line geometry(LineString, 25832)
)"

nz_rinnen_import_symbole: "
INSERT INTO \"entwaesserungsrinnen\" (\"Name\", geom_point)
SELECT
    bezeichnung,
    geom
FROM symbole
WHERE art = '26 Entwässerungsrinne'
AND bezeichnung NOT IN (
SELECT \"Name\" FROM \"entwaesserungsrinnen\"
)"

